    - data:
        instruction: "Você receberá os DADOS ATUAIS DO INTERESSE EM ADOÇÃO e a NOVA\
          \ MENSAGEM DO USUÁRIO.\n\nSua tarefa é atualizar os dados do interesse em\
          \ adoção.\n\nREGRAS:\n- As regras específicas de aceita_contato têm prioridade\
          \ sobre as regras gerais de extração.\n\n- Se quer_iniciar_adocao = \"não\"\
          \ e consultar_status = \"não\", não preserve interesse_animal automaticamente.\n\
          \n- Se a nova mensagem não mencionar nenhum animal e for apenas uma saudação,\
          \ conversa geral ou mudança de assunto, deixe interesse_animal vazio.\n\
          - As regras acima sobre interesse_animal têm prioridade sobre as regras\
          \ gerais de preservação.\n\n- Preserve interesse_animal somente enquanto\
          \ o usuário estiver:\n  1. iniciando um processo de adoção; ou\n  2. consultando\
          \ o status de uma solicitação.\n- Preserve as informações que já estiverem\
          \ preenchidas.\n- Atualize um campo somente quando a nova mensagem trouxer\
          \ uma informação nova ou corrigir uma informação anterior.\n- Nunca apague\
          \ uma informação existente apenas porque ela não foi mencionada novamente.\n\
          - Nunca invente nome, telefone, e-mail ou animal de interesse.\n- Nunca\
          \ deduza autorização de contato.\n- Se o usuário demonstrar claramente que\
          \ deseja iniciar a adoção, use:\n  quer_iniciar_adocao = sim\n- Se o usuário\
          \ disser claramente que não deseja continuar, use:\n  quer_iniciar_adocao\
          \ = não\n- Se o usuário autorizar a ONG a entrar em contato, use:\n  aceita_contato\
          \ = sim\n- Se o usuário recusar contato, use:\n  aceita_contato = não\n\
          - Se uma informação ainda não existir, deixe o campo vazio.\n- Retorne todos\
          \ os parâmetros em cada execução.\n\nREGRAS PARA AUTORIZAÇÃO DE CONTATO:\n\
          \n- Se aceita_contato já estiver preenchido com \"sim\" ou \"não\", preserve\
          \ esse valor nas próximas mensagens.\n- Nunca substitua aceita_contato por\
          \ vazio apenas porque o usuário não falou novamente sobre autorização.\n\
          - Se aceita_contato = \"sim\", mantenha \"sim\" quando o usuário informar\
          \ nome, WhatsApp, e-mail ou outro dado solicitado.\n- Se aceita_contato\
          \ = \"não\", mantenha \"não\" até que o usuário diga claramente que mudou\
          \ de decisão.\n- Só altere aceita_contato quando o usuário autorizar ou\
          \ recusar o contato de forma explícita.\n- Ao receber apenas um nome, número\
          \ de WhatsApp ou endereço de e-mail, não altere aceita_contato.\n\nREGRAS\
          \ PARA WHATSAPP E ANIMAL:\n\n- Ao identificar um WhatsApp, extraia o número\
          \ completo com DDD.\n- Nunca salve apenas o DDD.\n- Preserve adotante_whatsapp\
          \ depois que estiver preenchido.\n- Preserve interesse_animal enquanto quer_iniciar_adocao\
          \ = \"sim\".\n- Não apague interesse_animal enquanto estiver coletando nome,\
          \ autorização, WhatsApp ou e-mail.\n- Só altere interesse_animal se o usuário\
          \ mencionar claramente outro animal.\nVALORES ATUAIS DA CONVERSA:\n\nAnimal\
          \ de interesse: {{#conversation.interesse_animal#}}\nQuer iniciar adoção:\
          \ {{#conversation.quer_iniciar_adocao#}}\nNome: {{#conversation.adotante_nome#}}\n\
          WhatsApp: {{#conversation.adotante_whatsapp#}}\nE-mail: {{#conversation.adotante_email#}}\n\
          Aceita contato: {{#conversation.aceita_contato#}}\nConsultar status: /\n\
          \nREGRAS DE PRESERVAÇÃO:\n\n- Se consultar_status já estiver como \"sim\"\
          , mantenha \"sim\" enquanto o usuário estiver fornecendo informações para\
          \ localizar a solicitação.\n\n- Se consultar_status = \"sim\" e o usuário\
          \ responder apenas com e-mail, WhatsApp, nome do animal ou outra informação\
          \ solicitada para realizar a consulta, mantenha consultar_status = \"sim\"\
          .\n\n- Não altere consultar_status para \"não\" apenas porque a mensagem\
          \ atual contém somente um e-mail ou WhatsApp.\n\n- Só altere consultar_status\
          \ para \"não\" quando a consulta tiver sido finalizada ou quando o usuário\
          \ claramente mudar de assunto.\n\n- Sempre considere os VALORES ATUAIS DA\
          \ CONVERSA antes de extrair novos dados.\n- Se o usuário fornecer um novo\
          \ valor para um campo, use o novo valor.\n- Se o usuário não mencionar novamente\
          \ um campo que já possui valor, mantenha o valor atual.\n- Nunca substitua\
          \ um valor já preenchido por vazio.\n- Só altere um valor existente quando\
          \ o usuário fornecer explicitamente uma nova informação.\n- Se quer_iniciar_adocao\
          \ já estiver como \"sim\", mantenha \"sim\" enquanto o processo de adoção\
          \ estiver em andamento.\n- Se interesse_animal já estiver preenchido, mantenha\
          \ esse animal enquanto o usuário estiver continuando o mesmo processo.\n\
          - Preserve também nome, WhatsApp, e-mail e autorização de contato já informados.\n\
          - Retorne todos os campos em todas as execuções."
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gemini-3.5-flash
          provider: langgenius/gemini/google
        parameters:
        - description: Nome do animal pelo qual o usuário demonstrou interesse em
            adotar. Extraia somente quando o usuário mencionar claramente um animal
            específico.
          name: interesse_animal
          required: false
          type: string
        - description: 'Indica se o usuário deseja iniciar o processo de adoção. Use
            "sim" ou "não" somente quando isso estiver claramente informado.

            '
          name: quer_iniciar_adocao
          required: false
          type: string
        - description: 'Nome da pessoa interessada em adotar. Extraia somente quando
            o usuário informar seu próprio nome.

            '
          name: adotante_nome
          required: false
          type: string
        - description: 'Número completo de WhatsApp informado pelo usuário.


            Extraia o número inteiro, incluindo DDD.


            Exemplo:

            "Meu WhatsApp é (99) 98456-3065"

            → adotante_whatsapp = "(99) 98456-3065"


            Nunca retorne somente o DDD.

            Nunca corte ou resuma o número.

            Se já estiver preenchido e o usuário não informar outro número, preserve
            o valor atual.'
          name: adotante_whatsapp
          required: false
          type: string
        - description: adotante_email
          name: adotante_email
          required: false
          type: string
        - description: Indica se o usuário autorizou a ONG a entrar em contato. Use
            "sim" ou "não" somente quando houver autorização ou recusa clara.
          name: aceita_contato
          required: false
          type: string
        - description: 'Use "sim" quando o usuário quiser saber o andamento ou status
            de uma adoção já iniciada.


            Exemplos:

            "Como está minha solicitação?"

            "Qual o status da adoção do Bento?"

            "Minha adoção foi aprovada?"


            Use "não" quando o usuário não estiver consultando o status de uma solicitação.'
          name: consultar_status
          required: false
          type: string
        - description: 'Espécie do animal de interesse.


            Use apenas:

            - "Cachorro"

            - "Gato"


            Exemplos:

            "Quero adotar um cachorro" → Cachorro

            "Quero adotar uma gata" → Gato


            Se a espécie já estiver identificada durante o processo de adoção, preserve
            o valor.


            Não confunda espécie com raça.'
          name: especie_animal
          required: false
          type: string
        - description: 'Indica se o usuário recusou fornecer o e-mail.


            Use "sim" somente quando o usuário recusar claramente informar o e-mail.


            Exemplos:

            - "não quero informar meu e-mail"

            - "prefiro não passar o e-mail"

            - "não vou informar"

            - se a pergunta atual for sobre o e-mail e o usuário responder apenas
            "não"


            REGRAS IMPORTANTES:


            - Se recusou_email já estiver como "sim", preserve "sim".

            - Nunca altere recusou_email por causa de respostas genéricas como "sim",
            "não", "ok", "certo" ou "agitado" dadas a outras perguntas.

            - Uma resposta "sim" só pode alterar recusou_email se estiver claramente
            respondendo a uma pergunta sobre fornecer o e-mail.

            - Só altere recusou_email de "sim" para "não" se o usuário fornecer um
            endereço de e-mail ou disser explicitamente que agora deseja informar
            o e-mail.

            - Se a mensagem atual não tratar de e-mail, mantenha o valor atual.'
          name: recusou_email
          required: false
          type: string
        - description: 'Indica se o usuário deseja ver, listar ou conhecer os animais
            disponíveis para adoção.


            Retorne "sim" quando o usuário pedir uma lista ou quiser ver animais disponíveis.


            Exemplos:

            - "Quais animais estão disponíveis?" → sim

            - "Me mostra os cachorros disponíveis" → sim

            - "Quero ver os gatos para adoção" → sim

            - "Pode me passar a lista de animais?" → sim

            - "Tem algum cachorro disponível?" → sim

            - "Quais filhotes estão disponíveis?" → sim


            Retorne "não" quando o usuário estiver falando sobre um animal específico
            ou outro assunto.


            Exemplos:

            - "Quero conhecer o Bento" → não

            - "Como está minha adoção?" → não

            - "Quero adotar a Amora" → não


            IMPORTANTE:

            Se o usuário fizer um novo pedido para ver animais disponíveis, retorne
            "sim".'
          name: listar_animais
          required: false
          type: string
