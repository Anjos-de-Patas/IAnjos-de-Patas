    nodes:
    - data:
        selected: false
        title: Iniciar
        type: start
        variables: []
      height: 89
      id: '1790352431850'
      position:
        x: 63.22026865766816
        y: 523.7696013530419
      positionAbsolute:
        x: 63.22026865766816
        y: 523.7696013530419
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 303
      zIndex: 0
    - data:
        instruction: 'Você receberá o PERFIL ATUAL DO ADOTANTE e uma NOVA MENSAGEM
          DO USUÁRIO.


          Sua tarefa é retornar o perfil atualizado.


          REGRAS:


          1. Preserve as informações que já existem no perfil atual.

          2. Atualize somente os campos sobre os quais a nova mensagem fornecer uma
          informação nova.

          3. Se a nova mensagem corrigir uma informação anterior, use a informação
          mais recente.

          4. Nunca apague uma informação existente somente porque ela não foi mencionada
          novamente.

          5. Nunca invente informações.

          6. Nunca faça suposições.

          7. Se determinado campo ainda não possui informação, deixe-o vazio.

          8. Retorne todos os parâmetros em cada execução.


          Padronização:


          - especie_preferida: cachorro, gato, outro ou sem preferência.

          - tipo_moradia: casa, apartamento ou outro.

          - possui_criancas: sim ou não.

          - outros_animais: animais existentes na residência.

          - porte_preferido: pequeno, médio, grande ou sem preferência.

          - idade_preferida: filhote, adulto, idoso ou sem preferência.

          - tempo_sozinho: tempo aproximado informado.

          - rotina: informações relevantes sobre trabalho, horários e disponibilidade.

          - possui_quintal: sim ou não.

          - nivel_atividade: tranquilo, moderado, ativo ou informação equivalente
          fornecida pelo usuário.'
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gemini-3.5-flash
          provider: langgenius/gemini/google
        parameters:
        - description: Espécie de animal que o usuário deseja adotar. Use valores
            como cachorro, gato, outro ou sem preferência. Extraia somente quando
            o usuário informar essa preferência.
          name: especie_preferida
          required: false
          type: string
        - description: Tipo de residência do usuário, como casa, apartamento ou outro.
          name: tipo_moradia
          required: false
          type: string
        - description: Indica se existem crianças na residência. Use sim ou não quando
            informado.
          name: possui_criancas
          required: false
          type: string
        - description: Animais que já vivem com o usuário, como gatos, cachorros ou
            outros.
