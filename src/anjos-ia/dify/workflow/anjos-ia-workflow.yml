    - data:
        code: "import json\nimport unicodedata\n\ndef normalizar(texto):\n    texto\
          \ = str(texto or \"\")\n    texto = unicodedata.normalize(\"NFD\", texto)\n\
          \    texto = \"\".join(\n        c for c in texto\n        if unicodedata.category(c)\
          \ != \"Mn\"\n    )\n    return texto.lower().strip()\n\ndef main(resultados:\
          \ list, animal_desejado: str) -> dict:\n    nome = normalizar(animal_desejado)\n\
          \n    if not nome:\n        return {\n            \"animal_encontrado\"\
          : \"nao\",\n            \"animal_resultado\": \"\"\n        }\n\n    for\
          \ item in resultados or []:\n        texto_original = json.dumps(\n    \
          \        item,\n            ensure_ascii=False\n        )\n\n        texto\
          \ = normalizar(texto_original)\n\n        nome_encontrado = nome in texto\n\
          \        esta_disponivel = \"status: disponivel\" in texto\n\n        if\
          \ nome_encontrado and esta_disponivel:\n            return {\n         \
          \       \"animal_encontrado\": \"sim\",\n                \"animal_resultado\"\
          : texto_original\n            }\n\n    return {\n        \"animal_encontrado\"\
          : \"nao\",\n        \"animal_resultado\": \"\"\n    }"
        code_language: python3
        outputs:
          animal_encontrado:
            children: null
            type: string
          animal_resultado:
            children: null
            type: string
